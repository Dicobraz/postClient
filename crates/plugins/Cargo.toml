[package]
name = "postman-plugins"
description = "Набор плагинов протоколов отдельными процессами (ADR 0013): postman-plugins --plugin=<id>"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "postman-plugins"
path = "src/main.rs"

[dependencies]
# Договор, сторона плагина (`backend::remote::serve_channel` и `serve_directory`) и сообщения обмена.
postman-core.workspace = true
# Запирание песочницы, сторож смерти хоста, связь — общий механизм процессов.
postman-proc.workspace = true
# Демо-канал — первый плагин отдельным процессом (PLG-02): без сети, для тестов и замера.
postman-demo.workspace = true
# Каталог сертификатов адресатов (S5-12 Ф5, PLG-06): общий файл — почта и каталог вместе (решение владельца
# 2026-11-16). Контроллер домена резолвит хост (функция ОС в интерфейсе), сервер приносит запрос.
postman-backend-ldap.workspace = true
tracing = "0.1"
# Журнал процесса — строками с уровнем в stderr (хост пишет их в журнал приложения); уровень — из `Hello` и смены
# настройки (`reload`). Та же копия, что у pets-shell.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[lints]
workspace = true

# Версия exe (build.rs, rc.exe из Windows SDK) — как у воркера: MSI сверяет её с версией комплекта (PLG-03).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Хранилище хоста в тесте процесса (`tests/process.rs`): состояние плагина — в базе хоста, не в файлах процесса.
postman-cache.workspace = true
# Подставной сервер LDAP для теста каталога настоящим процессом (`tests/ldap.rs`).
postman-backend-ldap = { workspace = true, features = ["testkit"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }
