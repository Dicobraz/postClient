[package]
name = "postman-plugins-matrix"
description = "Набор плагина Matrix отдельным процессом (ADR 0013, PLG-04): postman-plugins-matrix --plugin=matrix"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "postman-plugins-matrix"
path = "src/main.rs"

[dependencies]
# Договор, сторона плагина (`backend::remote::serve_channel` и `set_main`) и сообщения обмена.
postman-core.workspace = true
# Запирание песочницы, сторож смерти хоста, связь — общий механизм процессов.
postman-proc.workspace = true
# Канал Matrix (CH-05): ~16 МиБ кода — отдельным файлом набора, вне `postman.exe` и общего набора (решение
# владельца 2026-11-16: Matrix — компонент установки, в выпуск 0.2.0 не входит).
postman-backend-matrix.workspace = true
tracing = "0.1"
# Журнал процесса — строками с уровнем в stderr (хост пишет их в журнал приложения); уровень — из `Hello` и смены
# настройки (`reload`). Та же копия, что у общего набора.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[lints]
workspace = true

[dev-dependencies]
# Подставной сервер Matrix для сквозного теста без внешней сети (`tests/process.rs`).
postman-backend-matrix = { workspace = true, features = ["testkit"] }
# Хранилище хоста в тесте процесса (`tests/process.rs`): состояние плагина — в базе хоста, не в файлах процесса.
postman-cache.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros", "net", "io-util"] }
