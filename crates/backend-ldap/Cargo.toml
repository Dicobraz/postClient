[package]
name = "postman-backend-ldap"
description = "Каталог Active Directory — плагин ядра (ADR 0004): сертификаты адресатов S/MIME по LDAP (S5-12 Ф5)"
edition.workspace = true
version.workspace = true
license.workspace = true

# Процесс набора — `postman-plugins --plugin=ldap` (PLG-06, ADR 0013).
[features]
# Подменный сервер LDAP (`fake`) для тестов обмена — свой, через обмен (`tests/remote.rs`) и процесс набора
# (`crates/plugins/tests/ldap.rs`), как `testkit` у Telegram.
testkit = []

[dependencies]
postman-core.workspace = true
# LDAP (MIT/Apache-2.0); TLS — rustls с проверкой сертификата ОС, как у IMAP.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["rt", "time"] }
zeroize = "1"
thiserror.workspace = true
tracing = "0.1"

# Вход учётной записью — SASL GSSAPI (cross-krb5: на Windows — SSPI Kerberos, на Linux — libgssapi). На macOS
# libgssapi не собирается (в GSS.framework нет `gss_wrap_iov*`, а `iov` у cross-krb5 включён по умолчанию): там
# SASL GSSAPI свой — `kerberos.rs` поверх GSS.framework (`sys/macos.rs`), MAC-05.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ldap3 = { version = "0.12", default-features = false, features = ["gssapi"] }

# macOS: своё соединение до входа Kerberos (TLS, StartTLS), мост к `ldap3`; хеш сертификата — привязка к каналу TLS.
[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros"] }
sha2 = "0.11"
# Кадры обмена для теста через обмен (`tests/remote.rs`).
postman-proc.workspace = true
# Тесты обмена настоящей точкой входа (`serve`): свой крейт с подменным сервером (`fake`), как у Telegram.
postman-backend-ldap = { path = ".", features = ["testkit"] }

[lints]
workspace = true
