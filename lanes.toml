# Полосы Postman (скилл pets-dev). Пути — glob (fnmatch, * включает /). Первое совпадение сверху вниз.
# Полоса = единица параллельной работы одного агента. Правка этого файла — класс B.
# Слои — CLAUDE.md и crates/core/tests/layers.rs.

[common]
# Можно в любом PR: свои карточки, ручные проверки, новые решения.
paths = ["docs/tasks/*", "docs/manual-tests/*", "docs/decisions/*"]

[lane.ir]
# L0: HTML → безопасный IR.
paths = ["crates/ir/*"]

[lane.protocols]
# L1: протоколы.
paths = ["crates/jmap/*", "crates/imap/*", "crates/dav/*", "crates/ews/*"]

[lane.cache]
# L1: локальное хранилище и поиск.
paths = ["crates/cache/*", "crates/search/*"]

[lane.formats]
# L1: письмо, календарь и экспорт без I/O.
paths = ["crates/compose/*", "crates/calendar/*", "crates/export/*"]

[lane.sandbox]
# L1: механизм процессов и песочница (`postman-proc`), воркер и S/MIME (CODEOWNERS — класс B).
paths = ["crates/proc/*", "crates/worker/*", "crates/smime/*"]

[lane.core]
# L2: модель, договор плагинов, синхронизация.
paths = ["crates/core/*"]

[lane.backends]
# L2b: плагины путей к серверам; L3p: их наборы отдельными процессами (`postman-plugins`, `postman-plugins-matrix`,
# `postman-plugins-telegram`, ADR 0013; Matrix и Telegram — каждый своим файлом, PLG-04/PLG-05).
paths = ["crates/backend-*", "crates/plugins/*", "crates/plugins-matrix/*", "crates/plugins-telegram/*"]

[lane.app-gpui]
# L3: интерфейс, postman.exe.
paths = ["app-gpui/*"]

[lane.demo]
paths = ["crates/demo/*"]

[lane.viewers]
# Модули просмотра WASM и их SDK (ADR 0007): вне рабочей области, цель wasm32-unknown-unknown.
paths = ["viewers/*"]

[lane.docs-gen]
# Генерируемые документы: одна волна в день, от main.
paths = ["docs/PARITY.md"]

[lane.docs]
paths = ["docs/*", "*.md", "LICENSE"]

[lane.deps]
paths = ["Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml"]

[lane.ci]
paths = [".github/*", "scripts/*", "tools/*", ".config/*", ".cargo/*", "lanes.toml", "clippy.toml", ".gitattributes", ".gitignore"]
