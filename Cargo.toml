[workspace]
resolver = "3"
members = ["crates/ir", "crates/smime", "crates/jmap", "crates/imap", "crates/dav", "crates/ews", "crates/cache", "crates/compose", "crates/proc", "crates/worker", "crates/search", "crates/export", "crates/demo", "crates/calendar", "crates/core", "crates/backend-jmap", "crates/backend-imap", "crates/backend-dav", "crates/backend-ews", "crates/backend-ldap", "crates/backend-telegram", "crates/backend-matrix", "crates/plugins", "crates/plugins-matrix", "crates/plugins-telegram", "app-gpui", "tools/pack"]

[workspace.package]
edition = "2024"
version = "0.1.0-beta.7"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Часовые пояса — только встроенная база IANA (как на Windows): офлайн и одинаково на всех ОС; системная
# `/usr/share/zoneinfo` без `tzdata-legacy` (Ubuntu 24.04) не знает старых имён (America/Buenos_Aires).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tz-fat", "perf-inline", "tzdb-bundle-always", "serde"] }
postman-ir = { path = "crates/ir" }
postman-jmap = { path = "crates/jmap" }
postman-imap = { path = "crates/imap" }
postman-dav = { path = "crates/dav" }
postman-ews = { path = "crates/ews" }
postman-cache = { path = "crates/cache" }
postman-compose = { path = "crates/compose" }
postman-search = { path = "crates/search" }
postman-demo = { path = "crates/demo" }
postman-calendar = { path = "crates/calendar" }
postman-core = { path = "crates/core" }
postman-backend-jmap = { path = "crates/backend-jmap" }
postman-backend-imap = { path = "crates/backend-imap" }
postman-backend-dav = { path = "crates/backend-dav" }
postman-backend-ews = { path = "crates/backend-ews" }
postman-backend-ldap = { path = "crates/backend-ldap" }
postman-backend-telegram = { path = "crates/backend-telegram" }
postman-backend-matrix = { path = "crates/backend-matrix" }
postman-proc = { path = "crates/proc" }
postman-plugins = { path = "crates/plugins" }
# Набор Matrix — отдельным файлом (решение владельца 2026-11-16, PLG-04): тяжёлый канал не в общем наборе.
postman-plugins-matrix = { path = "crates/plugins-matrix" }
postman-plugins-telegram = { path = "crates/plugins-telegram" }
postman-worker = { path = "crates/worker" }
postman-smime = { path = "crates/smime" }
postman-export = { path = "crates/export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Просмотр PDF в воркере (S5-07, docs/SIZE.md «Воркер»): рендер одной страницы по запросу — холодный код,
# оптимизация по размеру. Крейты только воркера (gpui их не использует), на postman.exe не влияет.
[profile.release.package.hayro]
opt-level = "s"
[profile.release.package.hayro-interpret]
opt-level = "s"
[profile.release.package.hayro-syntax]
opt-level = "s"
[profile.release.package.hayro-jbig2]
opt-level = "s"
[profile.release.package.hayro-jpeg2000]
opt-level = "s"
[profile.release.package.hayro-ccitt]
opt-level = "s"
[profile.release.package.hayro-cmap]
opt-level = "s"
[profile.release.package.hayro-postscript]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.fearless_simd]
opt-level = "s"
[profile.release.package.pic-scale]
opt-level = "s"

# Проверка подписи S/MIME (S5-12, docs/SIZE.md «Воркер»): одна проверка на открытое письмо — холодный код, по
# размеру (бюджет воркера ≤ 10 МиБ, решение №6). Кроме `der` и `const-oid` — только в воркере.
[profile.release.package.postman-smime]
opt-level = "s"
[profile.release.package.cms]
opt-level = "s"
[profile.release.package.x509-cert]
opt-level = "s"
[profile.release.package.der]
opt-level = "s"
[profile.release.package.spki]
opt-level = "s"
[profile.release.package.rsa]
opt-level = "s"
[profile.release.package.crypto-bigint]
opt-level = "s"
[profile.release.package.crypto-primes]
opt-level = "s"
[profile.release.package.streebog]
opt-level = "s"

# Хост модулей просмотра на WASM (S8, ADR 0007, решение A): интерпретатор `wasmi` и проверка модуля `wasmparser` —
# холодный код, по размеру. Только в `postman-viewer.exe` (признак `viewer` воркера), на postman.exe не влияет.
[profile.release.package.wasmi]
opt-level = "s"
[profile.release.package.wasmi_core]
opt-level = "s"
[profile.release.package.wasmi_ir]
opt-level = "s"
[profile.release.package.wasmi_collections]
opt-level = "s"
[profile.release.package.wasmparser]
opt-level = "s"

# Канал Matrix (CH-05, docs/SIZE.md №12): `matrix-sdk`, `ruma*`, `vodozemac` и зависимости, которые тянет только
# Matrix, — холодный код канала, по размеру (`"z"`: −1,1 МиБ к `"s"`). Только точные имена (cargo без `*`); общие с остальным exe
# крейты (`sha2`, `rand`, `digest`…) не трогаем. Без `matrix-release` код канала в exe не попадает — на размер не влияет.
[profile.release.package]
anymap2 = { opt-level = "z" }
archery = { opt-level = "z" }
as_variant = { opt-level = "z" }
assign = { opt-level = "z" }
async-compression = { opt-level = "z" }
async-stream = { opt-level = "z" }
backon = { opt-level = "z" }
blake3 = { opt-level = "z" }
bs58 = { opt-level = "z" }
bytesize = { opt-level = "z" }
chacha20 = { opt-level = "z" }
chacha20poly1305 = { opt-level = "z" }
compression-codecs = { opt-level = "z" }
compression-core = { opt-level = "z" }
const_panic = { opt-level = "z" }
curve25519-dalek = { opt-level = "z" }
date_header = { opt-level = "z" }
decancer = { opt-level = "z" }
ed25519 = { opt-level = "z" }
ed25519-dalek = { opt-level = "z" }
eyeball = { opt-level = "z" }
eyeball-im = { opt-level = "z" }
generic-array = { opt-level = "z" }
growable-bloom-filter = { opt-level = "z" }
hex = { opt-level = "z" }
hpke = { opt-level = "z" }
imbl = { opt-level = "z" }
imbl-sized-chunks = { opt-level = "z" }
js_int = { opt-level = "z" }
js_option = { opt-level = "z" }
konst = { opt-level = "z" }
language-tags = { opt-level = "z" }
maplit = { opt-level = "z" }
matrix-pickle = { opt-level = "z" }
matrix-sdk = { opt-level = "z" }
matrix-sdk-base = { opt-level = "z" }
matrix-sdk-common = { opt-level = "z" }
matrix-sdk-crypto = { opt-level = "z" }
matrix-sdk-store-encryption = { opt-level = "z" }
mime2ext = { opt-level = "z" }
oauth2 = { opt-level = "z" }
oauth2-reqwest = { opt-level = "z" }
poly1305 = { opt-level = "z" }
postman-backend-matrix = { opt-level = "z" }
prost = { opt-level = "z" }
rand_xoshiro = { opt-level = "z" }
readlock = { opt-level = "z" }
readlock-tokio = { opt-level = "z" }
rmp = { opt-level = "z" }
rmp-serde = { opt-level = "z" }
ruma = { opt-level = "z" }
ruma-client-api = { opt-level = "z" }
ruma-common = { opt-level = "z" }
ruma-events = { opt-level = "z" }
ruma-identifiers-validation = { opt-level = "z" }
safe_arch = { opt-level = "z" }
serde_bytes = { opt-level = "z" }
serde_html_form = { opt-level = "z" }
serde_path_to_error = { opt-level = "z" }
serdect = { opt-level = "z" }
typewit = { opt-level = "z" }
ulid = { opt-level = "z" }
unicode-normalization = { opt-level = "z" }
vodozemac = { opt-level = "z" }
wide = { opt-level = "z" }
wildmatch = { opt-level = "z" }
x25519-dalek = { opt-level = "z" }
xxhash-rust = { opt-level = "z" }

# «Не падать» (S2-03): вне тестов нет unwrap/expect/panic!; в тестах разрешены (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
# Патч Windows-платформы gpui (шейдеры в exe, кадры по запросу, живой ресайз) — общий для приложений Pets:
# github.com/Dicobraz421/pets, crates/pets-gpui-windows.
gpui-pre-windows = { git = "https://github.com/Dicobraz421/pets", rev = "bd68b87dd89618e059b582651a11d8bccd0fac47" }
# Патч gpui-kit (gpui-base 0.9.1): блоки в тексте поля, как в Zed, — таблица сеткой и картинки в письме (T3-06, T3-07):
# github.com/Dicobraz421/pets, crates/pets-gpui-base.
gpui-base = { git = "https://github.com/Dicobraz421/pets", rev = "bd68b87dd89618e059b582651a11d8bccd0fac47" }
# Linux-платформа gpui (GLIN-01): эмодзи цветным шрифтом (gpui-pre-wgpu), перетаскивание файлов наружу X11 XDND
# (gpui-pre-linux, `gpui_linux::pets::drag`): github.com/Dicobraz421/pets, crates/pets-gpui-linux и pets-gpui-wgpu.
gpui-pre-linux = { git = "https://github.com/Dicobraz421/pets", rev = "bd68b87dd89618e059b582651a11d8bccd0fac47" }
gpui-pre-wgpu = { git = "https://github.com/Dicobraz421/pets", rev = "bd68b87dd89618e059b582651a11d8bccd0fac47" }
# macOS-платформа gpui (GMAC-01): кадры — как у Apple и в исходнике (CAMetalDisplayLink на macOS 14+, CVDisplayLink на
# macOS 13; откат — `GPUI_CV_DISPLAY_LINK=1`), диагностика кадров — цель `gpui_macos::frames`: crates/pets-gpui-macos-platform.
gpui-pre-macos = { git = "https://github.com/Dicobraz421/pets", rev = "bd68b87dd89618e059b582651a11d8bccd0fac47" }

# Отладочная информация только для своего кода: target/debug не раздувается до десятков ГБ.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# S/MIME (S5-12): хэши и длинная арифметика в отладочной сборке — с оптимизацией, иначе проверка письма на 60 МБ
# в тестах песочницы упирается в сторожа воркера (8 с), а подписи RSA и ГОСТ в тестах идут секундами.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.streebog]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.postman-smime]
opt-level = 2
